<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connaître le nombre</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="practice-panel" aria-live="polite">
        <div class="round-meta">
          <span id="round-label">Prêt</span>
          <span id="timer" class="timer">...</span>
        </div>
        <div id="status" class="status">Appuie sur Démarrer quand tu es prêt.</div>
        <div id="result" class="result" hidden></div>

        <details class="settings">
          <summary>Paramètres</summary>
          <div class="settings-grid">
            <label for="minimum">Minimum</label>
            <input id="minimum" name="minimum" type="number" step="1">
            <label for="maximum">Maximum</label>
            <input id="maximum" name="maximum" type="number" step="1">
            <label for="duration">Durée (secondes)</label>
            <input id="duration" name="duration" type="number" min="1" step="1">
          </div>
          <p class="settings-hint">Les réglages s'appliquent à la prochaine manche.</p>
        </details>

        <form id="answer-form" autocomplete="off">
          <label for="answer">Ta réponse</label>
          <div class="answer-row">
            <input id="answer" name="answer" inputmode="numeric" placeholder="ex. 305" disabled>
            <button id="submit-button" type="submit" disabled>Vérifier</button>
          </div>
        </form>

        <button id="replay-button" type="button" disabled>Réécouter</button>
        <button id="start-button" class="start-button" type="button">Lancer la manche</button>
        <p class="hint">Appuie sur Entrée après chaque résultat pour continuer.</p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
